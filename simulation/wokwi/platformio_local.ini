; Offline/local override when registry install fails
[env:sim]
platform = symlink:///Users/svaraa_hq/.platformio/platforms/espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
  adafruit/Adafruit NeoPixel
  adafruit/Adafruit Unified Sensor
  adafruit/Adafruit BMP085 Library
  adafruit/Adafruit MPU6050
monitor_speed = 115200
build_flags =
  -DSVARAA_SIMULATION=1
  -DSVARAA_WOKWI_HARNESS=1
