; Svaraa V0 Wokwi visual hardware harness — `pio run -e sim`
; If PlatformIO registry install is blocked, use:
;   pio run -e sim -c platformio_local.ini
[env:sim]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
  adafruit/Adafruit NeoPixel
  adafruit/Adafruit Unified Sensor
  adafruit/Adafruit BMP085 Library
  adafruit/Adafruit MPU6050
monitor_speed = 115200
build_flags =
  -DSVARAA_SIMULATION=1
  -DSVARAA_WOKWI_HARNESS=1
