<text x="30" y="45.0" font-size="26" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">BP-05 | Power domains and forbidden ties</text>
<text x="30" y="82.0" font-size="15" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">USB bench only. No LiPo, receiver coil or raw battery hookup is authorized by this sheet.</text>
<rect x="30" y="155" width="300" height="150" rx="8" fill="#193c58" stroke="#e5f4ff" stroke-width="1.5"/>
<text x="43" y="182.0" font-size="18" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">POWERED USB DATA HUB</text>
<text x="43" y="211.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">PortA -&gt; NanoUSB-C</text>
<text x="43" y="229.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">PortB -&gt; NiclaMicro-USB</text>
<text x="43" y="248.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Two board power feeds</text>
<text x="43" y="267.7" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Verify total and per-port budget</text>
<rect x="440" y="145" width="315" height="175" rx="8" fill="#193c58" stroke="#e5f4ff" stroke-width="1.5"/>
<text x="453" y="172.0" font-size="18" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">NANO REGULATED3V3</text>
<text x="453" y="201.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Main sensor hub / BMP390 / GNSS</text>
<text x="453" y="219.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">INMP441 microphone</text>
<text x="453" y="238.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Pull-ups and switch inputs</text>
<text x="453" y="257.7" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Measure available current headroom</text>
<text x="453" y="276.6" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Do not power amplifier or pixels here.</text>
<rect x="440" y="385" width="315" height="130" rx="8" fill="#193c58" stroke="#e5f4ff" stroke-width="1.5"/>
<text x="453" y="412.0" font-size="18" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">NICLA INTERNAL SUPPLIES</text>
<text x="453" y="441.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Board powers own sensors/model</text>
<text x="453" y="459.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">ESLOV VCC_IN unused</text>
<text x="453" y="478.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Do not tie regulator outputs</text>
