<text x="883" y="172.0" font-size="18" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">PARTIAL-POWER CAUTION</text>
<text x="883" y="201.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">No hot-plug guarantee.</text>
<text x="883" y="219.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Check unpowered I/O back-feed.</text>
<text x="883" y="238.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Keep data inactive until ready.</text>
<text x="883" y="257.7" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Add reviewed isolation if needed.</text>
