<text x="883" y="436.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">AHCT125 and pixel strand</text>
<text x="883" y="454.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">MAX98357 amplifier</text>
<text x="883" y="473.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Grove vibration and buzzer</text>
<text x="883" y="492.7" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal"></text>
<text x="883" y="511.6" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">External negative -&gt;commonGND</text>
<text x="883" y="530.5" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">External positive NEVER -&gt;</text>
<text x="883" y="549.4" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">NanoVUSB, VIN or3V3</text>
