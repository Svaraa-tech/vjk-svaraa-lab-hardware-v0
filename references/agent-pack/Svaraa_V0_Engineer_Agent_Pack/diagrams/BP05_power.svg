<text x="43" y="561.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">&gt;=2A initial bench choice</text>
<text x="43" y="579.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Fuse / rated factory terminals</text>
<text x="43" y="598.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Separate positive power domain</text>
<text x="43" y="617.7" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Measure simultaneous load peaks</text>
