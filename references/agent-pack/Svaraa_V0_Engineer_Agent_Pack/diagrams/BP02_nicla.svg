<text x="348" y="427.0" font-size="18" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">PRIVATE BUS RULES</text>
<text x="348" y="456.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Nicla controller; Nano Wire1 target0x2A</text>
<text x="348" y="474.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">R2/R3:4.7k from SDA/SCL to Nano3V3</text>
<text x="348" y="493.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Inspect existing pull-ups before adding.</text>
<text x="348" y="512.7" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">100kHz;32-byte frames;8-byte mailbox</text>
<text x="348" y="531.6" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">No PCM audio; no direct remote IMU reads.</text>
<rect x="30" y="590" width="1140" height="80" rx="8" fill="#193c58" stroke="#e5f4ff" stroke-width="1.5"/>
<text x="43" y="617.0" font-size="18" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">POWER AND QUALIFICATION</text>
<text x="43" y="646.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Verify boards separately; power off to wire. No hot-plug or partial-power guarantee. Measure back-powering before allowing one side off.</text>
<polyline points="25,711 1175,711" fill="none" stroke="#829daf" stroke-width="1"/>
<text x="30" y="736.0" font-size="12" font-family="DejaVu Sans" fill="#d3b575" font-weight="normal">Use J5 pin numbers and continuity, not a guessed left/right cable view. [S04-S09, S21-S22]</text>
<text x="30" y="762.0" font-size="10" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">SVARAA V0.1 / 17 NOV 2026 / PROPOSED MODULE-LEVEL DESIGN - PHYSICAL QUALIFICATION REQUIRED</text>
</svg>