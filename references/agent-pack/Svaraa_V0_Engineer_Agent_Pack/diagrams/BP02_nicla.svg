<text x="30" y="45.0" font-size="26" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">BP-02 | Signal-only Nicla ESLOV harness</text>
<text x="30" y="82.0" font-size="15" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">ESLOV pin1 is a 5V INPUT, not an output. The adapter is not a voltage converter.</text>
<rect x="30" y="160" width="255" height="300" rx="8" fill="#193c58" stroke="#e5f4ff" stroke-width="1.5"/>
<text x="43" y="187.0" font-size="18" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">NICLA J5</text>
<text x="43" y="216.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">1 VCC_IN: leave unfed</text>
<text x="43" y="234.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">2 INT: unused</text>
<text x="43" y="253.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">3 SCL -&gt; NanoD3</text>
<text x="43" y="272.7" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">4 SDA -&gt; NanoD4</text>
<text x="43" y="291.6" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">5 GND -&gt; commonGND</text>
<text x="43" y="310.5" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal"></text>
<text x="43" y="329.4" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Power by Micro-USB.</text>
<text x="43" y="348.3" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Initialize nicla::begin().</text>
<text x="43" y="367.20000000000005" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Verify external3.3V I/O.</text>
<rect x="335" y="180" width="210" height="150" rx="8" fill="#193c58" stroke="#e5f4ff" stroke-width="1.5"/>
<text x="348" y="207.0" font-size="18" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">4483 CABLE</text>
<text x="348" y="236.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">5-pin ESLOV to</text>
<text x="348" y="254.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">4-pin QT adapter</text>
<text x="348" y="273.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">No level conversion</text>
<rect x="600" y="180" width="230" height="150" rx="8" fill="#193c58" stroke="#e5f4ff" stroke-width="1.5"/>
<text x="613" y="207.0" font-size="18" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">JH2 PASSIVE HUB</text>
<text x="613" y="236.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Factory5625 sockets</text>
<text x="613" y="254.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Only this signal link</text>
<text x="613" y="273.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">NO sensors / power feed</text>
<rect x="885" y="160" width="285" height="300" rx="8" fill="#193c58" stroke="#e5f4ff" stroke-width="1.5"/>
<text x="898" y="187.0" font-size="18" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">4209 TO NANO</text>
<text x="898" y="216.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Verified SDA -&gt;D4 GPIO7</text>
<text x="898" y="234.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Verified SCL -&gt;D3 GPIO6</text>
<text x="898" y="253.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Verified GND -&gt;GND</text>
<text x="898" y="272.7" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal"></text>
<text x="898" y="291.6" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">V+ lead: NOT CONNECTED</text>
<text x="898" y="310.5" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Insulate exposed male pin.</text>
<text x="898" y="329.4" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Never join JH1 V+ or3V3.</text>
<text x="898" y="348.3" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Color is not proof of pinout.</text>
