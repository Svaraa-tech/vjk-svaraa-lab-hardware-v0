<text x="583" y="486.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">VIN -&gt; EXT_5V</text>
<text x="583" y="504.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">GND -&gt; commonGND</text>
<text x="583" y="523.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">BCLK -&gt;D5; LRC -&gt;D6</text>
<text x="583" y="542.7" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">DIN -&gt;D8</text>
<text x="583" y="561.6" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">GAIN/SD: verified module default</text>
<text x="583" y="580.5" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Never expose Nano to5V pull-up.</text>
