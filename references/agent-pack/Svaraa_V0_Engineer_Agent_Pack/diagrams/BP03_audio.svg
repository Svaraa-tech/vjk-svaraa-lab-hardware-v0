<text x="30" y="45.0" font-size="26" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">BP-03 | Audio wiring and speaker isolation</text>
<text x="30" y="82.0" font-size="15" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">V0 uses a dedicated PCM microphone. Nicla handles local wake and motion; raw audio forwarding is not assumed.</text>
<rect x="35" y="160" width="310" height="400" rx="8" fill="#193c58" stroke="#e5f4ff" stroke-width="1.5"/>
<text x="48" y="187.0" font-size="18" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">NANO AUDIO PORT</text>
<text x="48" y="216.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">D5 GPIO8 -&gt; BCLK</text>
<text x="48" y="234.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">D6 GPIO9 -&gt; WS/LRCLK</text>
<text x="48" y="253.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">D7 GPIO10 &lt;- INMP SD</text>
<text x="48" y="272.7" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">D8 GPIO17 -&gt; amplifier DIN</text>
<text x="48" y="291.6" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal"></text>
<text x="48" y="310.5" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Philips I2S</text>
<text x="48" y="329.4" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">16kHz, two32-bit slots</text>
<text x="48" y="348.3" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">BCLK target1.024MHz</text>
<text x="48" y="367.20000000000005" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal"></text>
<text x="48" y="386.1" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Half-duplex V0</text>
<text x="48" y="405.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Start at low volume.</text>
<rect x="570" y="150" width="280" height="220" rx="8" fill="#193c58" stroke="#e5f4ff" stroke-width="1.5"/>
