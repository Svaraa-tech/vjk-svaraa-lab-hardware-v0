<text x="933" y="211.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">No speaker on GPIO.</text>
<text x="933" y="229.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">No grounded headphones.</text>
<text x="933" y="248.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Check slot/sign conversion.</text>
