<text x="30" y="45.0" font-size="26" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">BP-04 | Pixel level shifter and control outputs</text>
<text x="30" y="82.0" font-size="15" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Use SN74AHCT125N PDIP-14. This is a 5V-powered TTL-input buffer, not a generic HC substitute.</text>
<rect x="30" y="160" width="275" height="160" rx="8" fill="#193c58" stroke="#e5f4ff" stroke-width="1.5"/>
<text x="43" y="187.0" font-size="18" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">NANO D9 GPIO18</text>
<text x="43" y="216.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Data -&gt; U4 pin2 / 1A</text>
<text x="43" y="234.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">R6 10k: pin2 toGND</text>
<text x="43" y="253.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Signal inactive until supplies ready</text>
<text x="43" y="272.7" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">CommonGND first</text>
<rect x="380" y="135" width="355" height="295" rx="8" fill="#193c58" stroke="#e5f4ff" stroke-width="1.5"/>
<text x="393" y="162.0" font-size="18" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">U4 SN74AHCT125N</text>
<text x="393" y="191.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">14 VCC -&gt; EXT_5V</text>
<text x="393" y="209.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">7 GND -&gt;commonGND</text>
<text x="393" y="228.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">1 /OE1 -&gt;GND</text>
<text x="393" y="247.7" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">2 1A &lt;- NanoD9</text>
<text x="393" y="266.6" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">3 1Y -&gt; R5 330ohm -&gt; pixelDIN</text>
<text x="393" y="285.5" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">C2 100nF across14/7</text>
<text x="393" y="304.4" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Unused /OE4,10,13 -&gt;5V</text>
<text x="393" y="323.3" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Unused A5,9,12 -&gt;GND</text>
<text x="393" y="342.20000000000005" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Unused Y6,8,11 -&gt;NC</text>
<rect x="835" y="160" width="335" height="245" rx="8" fill="#193c58" stroke="#e5f4ff" stroke-width="1.5"/>
<text x="848" y="187.0" font-size="18" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">PIXEL INPUT CONNECTOR</text>
<text x="848" y="216.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">V+ -&gt; EXT_5V</text>
<text x="848" y="234.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">GND -&gt;commonGND</text>
<text x="848" y="253.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">DIN &lt;- R5 from U4 pin3</text>
<text x="848" y="272.7" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">C4 470uF &gt;=10V across supply</text>
<text x="848" y="291.6" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Use factory mating pigtail.</text>
<text x="848" y="310.5" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Index0 top;1-4 lower lights</text>
<text x="848" y="329.4" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Indices5-19 ALWAYS OFF.</text>
<polyline points="305,235 380,235" fill="none" stroke="#75ddd5" stroke-width="2"/>
<polyline points="735,315 835,315" fill="none" stroke="#75ddd5" stroke-width="2"/>
<rect x="35" y="490" width="540" height="165" rx="8" fill="#193c58" stroke="#e5f4ff" stroke-width="1.5"/>
<text x="48" y="517.0" font-size="18" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">GROVE VIBRATION</text>
<text x="48" y="546.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">NanoD12 GPIO47 -&gt; SIG</text>
<text x="48" y="564.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">EXT_5V -&gt;VCC; commonGND -&gt;GND</text>
<text x="48" y="583.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Unused cable signal insulated</text>
<text x="48" y="602.7" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Onboard driver required; do not connect bare motor toGPIO.</text>
<rect x="625" y="490" width="545" height="165" rx="8" fill="#193c58" stroke="#e5f4ff" stroke-width="1.5"/>
<text x="638" y="517.0" font-size="18" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="bold">GROVE BUZZER</text>
<text x="638" y="546.0" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">NanoA0 GPIO1 -&gt;SIG</text>
<text x="638" y="564.9" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">EXT_5V -&gt;VCC; commonGND -&gt;GND</text>
<text x="638" y="583.8" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">Bounded duty/time; independent of assistant playback</text>
<text x="638" y="602.7" font-size="14" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">No assumption of Apple Find My acoustic compliance.</text>
<polyline points="25,711 1175,711" fill="none" stroke="#829daf" stroke-width="1"/>
<text x="30" y="736.0" font-size="12" font-family="DejaVu Sans" fill="#d3b575" font-weight="normal">Power loads through rated terminal distribution, not Nano3V3. Start with low brightness/volume and measure. [S16-S20]</text>
<text x="30" y="762.0" font-size="10" font-family="DejaVu Sans" fill="#e5f4ff" font-weight="normal">SVARAA V0.1 / 17 NOV 2026 / PROPOSED MODULE-LEVEL DESIGN - PHYSICAL QUALIFICATION REQUIRED</text>
