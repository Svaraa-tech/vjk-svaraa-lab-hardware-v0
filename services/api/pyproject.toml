[project]
name = "svaraa-v0-api"
version = "0.1.0"
description = "Svaraa V0 Lab local API (SIM)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.121.2",
  "uvicorn[standard]==0.38.0",
  "pydantic==2.12.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
